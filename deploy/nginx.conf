# Exemplo de configuração Nginx para servir o build estático (pasta dist/).
#
# Por ser um SPA sem backend, a concorrência é limitada apenas pela entrega de
# arquivos estáticos — dezenas/milhares de acessos simultâneos são triviais com
# cache e compressão. Cada acesso roda isolado no navegador do fiel; não há
# estado de servidor nem dados de usuário trafegando pela rede.

server {
    listen 80;
    server_name _;
    root /var/www/exame/dist;
    index index.html;

    # Compressão
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1024;
    # Se o módulo brotli estiver disponível, descomente:
    # brotli on;
    # brotli_types text/css application/javascript image/svg+xml application/manifest+json;

    # Assets com hash no nome: cache longo e imutável.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # O service worker não pode ser cacheado agressivamente.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: qualquer rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
