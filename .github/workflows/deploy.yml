name: Deploy GitHub Pages

# Publica o app estático no GitHub Pages.
# Pré-requisito (uma vez): em Settings → Pages → "Build and deployment",
# escolha Source = "GitHub Actions".

on:
  push:
    branches:
      - main
      - claude/confession-exam-refactor-0IpjY
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; cancela execuções em andamento desatualizadas.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Habilita o Pages automaticamente (source = GitHub Actions), se possível.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      # base = caminho público do Pages (ex.: /fe-catolica/), vindo do configure-pages.
      - run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
